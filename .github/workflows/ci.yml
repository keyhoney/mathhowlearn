name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://math.howlearn.kr
      FORMSPREE_FORM_ID: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate problem content
        run: npm run problem:validate

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
